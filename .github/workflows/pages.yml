name: Demo and marketplace on GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Install Rust and WASM target
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default 1.95.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check and test
        run: |
          bun run check
          bun run docs:check
          bun run test
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        env:
          PAGES_BASE: ${{ github.event_name == 'pull_request' && '/uivolve-web' || steps.pages.outputs.base_path }}
        run: bun run build -- --base="${PAGES_BASE}/"
      - name: Fetch published skills catalog and create static routes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SKILLS_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("skills-v"))][0].tagName // empty')
          if [ -n "$SKILLS_TAG" ]; then
            mkdir -p .skill-release-catalog
            gh release download "$SKILLS_TAG" --repo "$GITHUB_REPOSITORY" --pattern marketplace.json --dir .skill-release-catalog
            bun run pages:prepare -- .skill-release-catalog/marketplace.json
          else
            bun run pages:prepare
          fi
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
