name: Release Claude skills plugin

on:
  push:
    tags: ["skills-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version (for example 0.1.0)
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: skills-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Install Rust and WASM target
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --target wasm32-unknown-unknown
          rustup default 1.95.0
      - run: bun install --frozen-lockfile
      - name: Check and test
        run: |
          bun run check
          bun run docs:check
          bun run test
      - name: Package plugin
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#skills-v}}"
          bun run skills:release -- "$VERSION"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(jq -r .tagName .skill-release/release-info.json)
          VERSION=$(jq -r .version .skill-release/release-info.json)
          ARCHIVE=$(jq -r .archiveName .skill-release/release-info.json)
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS=(--prerelease)
          else
            RELEASE_FLAGS=(--latest)
          fi
          gh release create "$TAG" ".skill-release/$ARCHIVE" .skill-release/marketplace.json .skill-release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "uivolve-web skills $VERSION" \
            "${RELEASE_FLAGS[@]}" \
            --notes 'App and engine development skills with bundled contracts and examples. The Claude plugin archive contains no engine binary or development dependencies.'
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
