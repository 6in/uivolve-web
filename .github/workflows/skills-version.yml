name: Skills plugin version

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Require a new plugin version when the bundled skills change
        run: bun run skills:check-version
