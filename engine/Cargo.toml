[package]
name = "wasm-ui-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rhai = { version = "1.26", default-features = false, features = [
  "std",
  "serde",
  "no_module",
  "no_custom_syntax",
  "no_time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
prost-reflect = { version = "0.16.5", features = ["serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
num-bigint = "0.5.1"
num-traits = "0.2.19"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
