[package]
name = "wasm-ui-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rhai = { version = "1.26", default-features = false, features = [
  "std",
  "serde",
  "no_module",
  "no_custom_syntax",
  "no_time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
