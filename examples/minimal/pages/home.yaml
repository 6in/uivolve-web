version: 1
id: home
title: Hello World
script: home.rhai
state:
  name: ""
  greeting: 名前を入力して「挨拶する」を押してください。
ui:
  xtype: container
  layout: vbox
  items:
    - xtype: textfield
      itemId: nameInput
      fieldLabel: 名前
      emptyText: 例：太郎
      bind: name
    - xtype: button
      itemId: helloButton
      text: 挨拶する
      handler: sayHello
      variant: primary
    - xtype: label
      itemId: greetingLabel
      bind: greeting
