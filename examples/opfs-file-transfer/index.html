<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OPFSファイル転送</title>
    <style>
      body {
        margin: 24px;
        font-family: sans-serif;
      }
      #error {
        color: #a00;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>OPFSファイル転送</h1>
    <p>bun run demo:transfer と bun run dev を起動してください。</p>
    <p><a href="?renderer=dom">DOM</a> / <a href="?renderer=canvas">Canvas</a></p>
    <p>CSV取得・加工・複数ファイル送信を順に実行します。低速受信は中止と進捗を確認できます。</p>
    <button id="generate">ホストで100 MiBを生成</button>
    <p id="generated" role="status"></p>
    <div id="error" role="alert"></div>
    <div id="app"></div>
    <script type="module" src="./boot.js"></script>
  </body>
</html>
