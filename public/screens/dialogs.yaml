version: 1
id: dialogs
title: ダイアログ
script: dialogs.rhai
state:
  name: 太郎
  notice: ボタンで通知・確認・入力ダイアログを試せます。
  loading: false
  dialogIcon: default
stateSchema:
  type: object
  properties:
    name:
      type: string
    notice:
      type: string
    loading:
      type: boolean
    dialogIcon:
      type: string
  required: [name, notice, loading, dialogIcon]
ui:
  xtype: container
  layout: vbox
  items:
    - xtype: label
      text: テーマに合わせたダイアログ
      variant: heading
    - xtype: textfield
      itemId: dialogName
      fieldLabel: 名前
      bind: name
      disabledBind: loading
    - xtype: container
      layout: hbox
      items:
        - xtype: button
          itemId: showAlert
          text: 通知（alert）
          handler: showAlert
          disabledBind: loading
        - xtype: button
          itemId: showConfirm
          text: 確認（confirm）
          handler: showConfirm
          disabledBind: loading
        - xtype: button
          itemId: showPrompt
          text: 入力（prompt）
          handler: showPrompt
          disabledBind: loading
    - xtype: combobox
      itemId: dialogIcon
      fieldLabel: アイコン
      bind: dialogIcon
      disabledBind: loading
      options:
        - value: default
          text: 種類ごとのデフォルト
        - value: info
          text: 情報
        - value: success
          text: 成功
        - value: warning
          text: 警告
        - value: error
          text: エラー
        - value: question
          text: 確認
        - value: input
          text: 入力
        - value: custom-image
          text: 任意の画像（SVG）
        - value: custom-text
          text: 任意の文字・絵文字
        - value: none
          text: アイコンなし
    - xtype: label
      itemId: dialogNotice
      bind: notice
    - xtype: label
      text: 同じダイアログをDOM・Canvasの各領域内に描画します。どちらで回答しても両側へ反映されます。
      variant: muted
    - xtype: label
      text: confirmのキャンセルはfalse、promptのキャンセルはnull、空文字のOKは空文字として受け取ります。
      variant: muted
    - xtype: label
      text: アイコンは標準・画像URL・絵文字を選べます。相対画像URLは画面定義のURLを基準に読み込みます。
      variant: muted
